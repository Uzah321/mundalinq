name: mundalinq
description: "MundaLinq: fresh produce straight from verified farms. Buyer app for Android and iOS."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^4.0.4
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  http: ^1.6.0
  # The icon set the web storefront uses, so both look alike.
  lucide_icons_flutter: ^3.1.25
  provider: ^6.1.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Sora.txt

  # Bundled rather than fetched at runtime, so text looks right on first launch and offline.
  # Both are SIL Open Font License fonts; their licences show on the app's licence page.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
